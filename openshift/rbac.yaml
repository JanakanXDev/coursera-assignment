apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-pipeline-edit
subjects:
  - kind: ServiceAccount
    name: tekton-pipeline
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
---
# For a Buildah task on a restricted cluster, an administrator may need to authorize the
# service account to run privileged builds. Example:
# oc adm policy add-scc-to-user privileged -z tekton-pipeline -n <project>
# oc adm policy add-role-to-user edit -z tekton-pipeline -n <project>
# The cluster administrator must explicitly grant this because restricted clusters do not
# automatically allow privileged containers.
